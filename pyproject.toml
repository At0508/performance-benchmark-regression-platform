[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-benchmark-regression-platform"
version = "0.1.0"
description = "A repeatable subprocess benchmark runner with baseline checks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bench-regress = "benchreg.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
