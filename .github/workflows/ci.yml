name: Runner checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit checks
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run example suite
        run: PYTHONPATH=src python -m benchreg.runner run examples/suite.json --output-dir results/ci
